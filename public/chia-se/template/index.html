  <script>

    function getArticleSlug() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const querySlug =
        params.get("slug");

      if (querySlug) {
        return querySlug;
      }


      const pathParts =
        window.location.pathname
          .split("/")
          .filter(Boolean);


      if (
        pathParts.length >= 2 &&
        pathParts[0] === "chia-se"
      ) {

        return pathParts[
          pathParts.length - 1
        ];

      }


      return "";

    }


    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    async function loadArticle() {

      const slug =
        getArticleSlug();


      const heading =
        document.getElementById(
          "article-heading"
        );

      const category =
        document.getElementById(
          "article-category"
        );

      const excerpt =
        document.getElementById(
          "article-excerpt"
        );

      const content =
        document.getElementById(
          "article-content"
        );


      if (!slug) {

        heading.textContent =
          "Không tìm thấy bài viết";

        content.innerHTML =
          "<p>Thiếu slug bài viết.</p>";

        return;

      }


      try {

        const response =
          await fetch(
            "/api/article/" +
            encodeURIComponent(slug)
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.ok ||
          !data.article
        ) {

          throw new Error(
            data.error ||
            "Không tìm thấy bài viết"
          );

        }

        const article =
        data.article;


        // =========================================================
        // SEO BÀI VIẾT
        // =========================================================

        const articleTitle =
        article.title ||
        "Chia sẻ – Trung Tử Tế";

        const articleDescription =
        article.excerpt ||
        article.title ||
        "Thông tin và góc nhìn kỹ thuật từ Trung Tử Tế.";

        const articleImage =
        article.cover_image ||
        "";


      // Title
      document.title =
      articleTitle +
      " – Trung Tử Tế";


// Meta description
const metaDescription =
  document.getElementById(
    "article-description"
  );

if (metaDescription) {
  metaDescription.setAttribute(
    "content",
    articleDescription
  );
}


// Open Graph title
      const ogTitle =
      document.getElementById(
      "article-og-title"
    );

      if (ogTitle) {
      ogTitle.setAttribute(
      "content",
      articleTitle +
      " – Trung Tử Tế"
    );
  }


// Open Graph description
const ogDescription =
  document.getElementById(
    "article-og-description"
  );

if (ogDescription) {
  ogDescription.setAttribute(
    "content",
    articleDescription
  );
}


// Open Graph image
const ogImage =
  document.getElementById(
    "article-og-image"
  );

if (ogImage && articleImage) {
  ogImage.setAttribute(
    "content",
    articleImage
  );
}


// Ngày đăng bài viết
const publishedTime =
  document.getElementById(
    "article-published-time"
  );

if (
  publishedTime &&
  article.created_at
) {
  publishedTime.setAttribute(
    "content",
    article.created_at
  );
}  
    // =========================================================
    // SCHEMA.ORG ARTICLE
    // =========================================================

    const schemaElement =
      document.getElementById(
        "article-schema"
      );

    if (schemaElement) {

      const schemaData = {
        "@context": "https://schema.org",
        "@type": "Article",

        "headline":
          article.title ||
          "",

        "description":
          article.excerpt ||
          article.title ||
          "",

        "author": {
          "@type": "Person",
          "name": "Trung Tử Tế"
        },

        "publisher": {
          "@type": "Organization",
          "name": "Trung Tử Tế"
        },

        "datePublished":
          article.created_at ||
          "",

        "image":
          article.cover_image ||
          ""
      };

      schemaElement.textContent =
        JSON.stringify(
          schemaData
        );
    }        
      // SCHEMA.ORG BREADCRUMB
const breadcrumbSchema =
  document.getElementById(
    "breadcrumb-schema"
  );

if (breadcrumbSchema) {

  const breadcrumbData = {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",

    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Trang chủ",
        "item": "/"
      },

      {
        "@type": "ListItem",
        "position": 2,
        "name": "Chia sẻ",
        "item": "/chia-se/"
      },

      {
        "@type": "ListItem",
        "position": 3,
        "name":
          article.title ||
          "",
        "item":
          window.location.pathname
      }
    ]
  };

  breadcrumbSchema.textContent =
    JSON.stringify(
      breadcrumbData
    );
}

        const description =
          document.getElementById(
            "article-description"
          );


        if (description) {

          description.setAttribute(
            "content",
            article.excerpt ||
            article.title
          );

        }


        heading.textContent =
          article.title ||
          "";


        category.textContent =
          article.icon
            ? article.icon +
              " " +
              (article.category || "CHIA SẺ")
            : (
              article.category ||
              "CHIA SẺ"
            );


        excerpt.textContent =
          article.excerpt ||
          "";


        content.innerHTML =
          article.content ||
          "<p>Chưa có nội dung bài viết.</p>";


      } catch (error) {

        console.error(
          "Lỗi tải bài viết:",
          error
        );


        heading.textContent =
          "Không thể tải bài viết";


        content.innerHTML =
          "<p>" +
          escapeHtml(
            error.message ||
            "Đã xảy ra lỗi khi tải bài viết."
          ) +
          "</p>";

      }

    }


    loadArticle();

  </script>
